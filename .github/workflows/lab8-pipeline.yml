name: DevOps Lab 8 - CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code inside the GitHub Runner
    - name: Check out repository code
      uses: actions/checkout@v4

    # Step 2: Set up Python environment
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    # Step 3: Install dependencies (flake8 for linting, pytest for testing)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest

    # Step 4: Run code linting
    - name: Lint code with Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 cicd-lab8-GitHubActions/app.py --count --select=E9,F63,F7,F82 --show-source --statistics

    # Step 5: Run unit tests
    - name: Run PyTest
      run: |
        pytest cicd-lab8-GitHubActions/test_app.py

    # Step 6: Build Docker image to confirm packaging works
    - name: Build Docker image
      run: |
        cd cicd-lab8-GitHubActions
        docker build -t lab8-test-app:${{ github.sha }} .